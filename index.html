<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Персонажи</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#0b0b0d;--line:#1a1a1f;--text:#f5f5f7;--mute:#85858f;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--vh:100vh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--text);font:15px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:calc(var(--sat) + 18px) 16px calc(var(--sab) + 70px);min-height:100vh;background:radial-gradient(520px 320px at 85% -80px,#ff2d9522,transparent 70%),radial-gradient(480px 300px at -10% 20%,#3d5afe1c,transparent 70%),#000}
button{font-family:inherit}
h1{font:700 30px/1.1 Unbounded,Manrope,sans-serif;margin:8px 0 6px;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 18px;max-width:34ch}
.search{width:100%;background:#0d0d10;border:1px solid var(--line);border-radius:16px;padding:13px 16px;color:var(--text);font:inherit;outline:none}
.search:focus{border-color:#3a3a45}
.chips{display:flex;gap:8px;margin:14px 0 18px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--mute);padding:8px 15px;border-radius:99px;font:600 13px Manrope,sans-serif;cursor:pointer}
.chip.on{background:var(--text);color:#000;border-color:var(--text)}
.list{display:grid;gap:12px}
.card{--a:#fff;--b:#888;position:relative;display:flex;gap:14px;align-items:center;padding:14px;border-radius:22px;background:var(--card);border:1px solid var(--line);cursor:pointer;overflow:hidden;transition:transform .18s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 120px at 0% 50%,color-mix(in srgb,var(--a) 20%,transparent),transparent 70%);pointer-events:none}
.card:active{transform:scale(.975)}
.card.lock{opacity:.45;cursor:default}
.ava{--a:#fff;--b:#888;position:relative;flex:none;width:62px;height:62px;border-radius:22px;overflow:hidden;display:grid;place-items:center;font:700 26px Unbounded,sans-serif;color:#000;background:linear-gradient(140deg,var(--a),var(--b));box-shadow:0 0 28px color-mix(in srgb,var(--a) 45%,transparent)}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ava.sm{width:42px;height:42px;border-radius:15px;font-size:18px;box-shadow:none}
.ava.xl{width:110px;height:110px;border-radius:34px;font-size:48px}
.ava.prof{width:90px;height:90px;border-radius:28px;font-size:36px;margin:0 auto 16px;background:linear-gradient(140deg,#3d5afe,#b06bff)}
.card.lock .ava{background:#16161a;box-shadow:none;color:#444}
.info{position:relative;min-width:0;flex:1}
.name{font:700 16px Unbounded,Manrope,sans-serif;margin:0 0 2px}
.role{color:var(--mute);font-size:13px;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.last{color:#b9b9c2;font-size:13px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Action styling inside last message */
.last .action{color:#85858f;font-style:italic}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;margin:0 5px 0 0;color:color-mix(in srgb,var(--a) 70%,#fff);background:color-mix(in srgb,var(--a) 14%,#000)}
.empty{color:var(--mute);text-align:center;padding:36px 0}
.foot{color:#4b4b54;font-size:12px;text-align:center;margin-top:26px}
/* chat */
.chat{--a:#fff;--b:#888;position:fixed;left:0;top:0;width:100%;height:var(--vh);z-index:10;display:flex;flex-direction:column;background:radial-gradient(420px 260px at 50% -40px,color-mix(in srgb,var(--a) 22%,transparent),transparent 75%),#000}
.chat[hidden]{display:none}
.chead{display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 10px) 12px 10px;border-bottom:1px solid var(--line);background:#000c;backdrop-filter:blur(14px)}
.ib{flex:none;width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:#0d0d10;color:var(--text);display:grid;place-items:center;cursor:pointer}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ct{flex:1;min-width:0}.ct b{display:block;font:700 15px Unbounded,Manrope,sans-serif}.ct span{color:var(--mute);font-size:12px}
.msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.m{max-width:82%;padding:10px 14px;border-radius:20px;white-space:pre-wrap;word-wrap:break-word;animation:pop .2s ease-out}
.m.assistant{align-self:flex-start;background:#121216;border:1px solid var(--line);border-bottom-left-radius:6px}
.m.user{align-self:flex-end;color:#000;background:linear-gradient(130deg,var(--a),var(--b));border-bottom-right-radius:6px}
.m.err{align-self:center;background:#2a0f14;color:#ff9aa6;font-size:13px;border-radius:14px;cursor:pointer}
/* Стили для действий и эмоций (звездочек) */
.m .action { color: #a0a0aa; font-style: italic; }

.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;background:#121216;border:1px solid var(--line);border-radius:20px 20px 20px 6px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--a);animation:bl 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-4px)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.intro{margin:auto;text-align:center;padding:10px 8px;max-width:340px}
.intro .ava{margin:0 auto 14px}.intro h2{font:700 22px Unbounded,sans-serif;margin:0 0 4px}.intro p{color:var(--mute);margin:0 0 12px}
.intro .sl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px}
.intro .sl span{padding:5px 11px;border-radius:12px;background:#111116;border:1px solid var(--line);font-size:13px}
.bar{display:flex;gap:10px;align-items:flex-end;padding:10px 12px calc(var(--sab) + 10px);border-top:1px solid var(--line);background:#000}
.bar textarea{flex:1;resize:none;max-height:120px;border:1px solid var(--line);background:#0d0d10;color:var(--text);border-radius:20px;padding:11px 16px;font:inherit;outline:none}
.bar textarea:focus{border-color:#3a3a45}
.send{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(130deg,var(--a),var(--b));color:#000;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 22px color-mix(in srgb,var(--a) 40%,transparent)}
.send:disabled{opacity:.4}.send svg{width:20px;height:20px;stroke:#000;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Navbar */
.nav{position:fixed;bottom:0;left:0;width:100%;display:flex;background:#050507e6;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:4px 10px calc(var(--sab) + 8px);z-index:5}
.navbtn{flex:1;background:transparent;border:none;color:var(--mute);padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 12px Manrope,sans-serif;cursor:pointer;transition:color .2s}
.navbtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.navbtn.on{color:#fff}

/* Settings View */
#settings{display:none;animation:pop .2s ease-out}
.prof-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 16px;text-align:center;margin-top:20px}
.prof-name{font:700 20px Unbounded,sans-serif;margin:0 0 6px}
.prof-id{color:var(--mute);font-size:14px;font-family:monospace}
.prof-info{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);color:#b9b9c2;font-size:14px;line-height:1.5}
</style>
</head>
<body>

<!-- Tab 1: Chats -->
<div id="home">
  <h1>Персонажи</h1>
  <p class="sub">Выбери, с кем поболтать. У каждого свой отдельный чат.</p>
  <input class="search" id="q" placeholder="Поиск по имени или стилю" autocomplete="off">
  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>
</div>

<!-- Tab 2: Settings -->
<div id="settings">
  <h1>Профиль</h1>
  <p class="sub">Твои данные из Telegram.</p>
  <div class="prof-card">
    <div class="ava prof" id="p-ava"></div>
    <div class="prof-name" id="p-name">Загрузка...</div>
    <div class="prof-id" id="p-id"></div>
    <div class="prof-info">
      Персонажи знают твоё имя, видят твой ID и могут обращаться к тебе.<br>Связь работает на бесплатном Roleplay API (G4F/Pollinations).
    </div>
  </div>
</div>

<!-- Bottom Navigation -->
<nav class="nav" id="nav">
  <button class="navbtn on" data-tab="home">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    Чаты
  </button>
  <button class="navbtn" data-tab="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Профиль
  </button>
</nav>

<!-- Chat View (Overlay) -->
<section class="chat" id="chat" hidden>
  <header class="chead">
    <button class="ib" id="back" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="cava"></div>
    <div class="ct"><b id="cname"></b><span>Живое общение (RP)</span></div>
    <button class="ib" id="clr" aria-label="Очистить чат"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </header>
  <div class="msgs" id="msgs"></div>
  <div class="bar">
    <textarea id="inp" rows="1" placeholder="Ответить (действия в *звездочках*)" maxlength="2000"></textarea>
    <button class="send" id="send" aria-label="Отправить"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</section>

<script>
// === НАСТРОЙКИ ===
const API_URL = "https://chechetka.duckdns.org:8443";   // https-адрес API бота (без / в конце)
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000'); tg.disableVerticalSwipes(); } catch(e){} }

const CHARS = [
 { id:'cupsize', cat:'streamers', photo:'img/cupsize.jpg', name:'Капсайз', role:'Музыкант, Ироник', a:'#ff2d95', b:'#ff7a18', tags:['юмор','музыка'],
   desc:'Коля Мамаев. Автор «В окно с тобой». Ироничный, самоуверенный, но добрый.',
   slang:[], greeting:'*зевает и потягивается* Привет. Чё хотел?' },
 { id:'madk1d', cat:'streamers', photo:'img/madk1d.jpg', name:'madk1d', role:'Рэпер, Дотер', a:'#00e5ff', b:'#3d5afe', tags:['CS и Dota','музыка'],
   desc:'Марк. Пишет рэп, рубится в доту. Супер-эмоциональный и заводной.',
   slang:[], greeting:'*улыбается во все 32 зуба* Здарова! Как жизнь?' },
 { id:'whyousolonely', cat:'streamers', photo:'img/whyousolonely.jpg', name:'whyousolonely', role:'Вайбовый IRL', a:'#b06bff', b:'#5b6cff', tags:['IRL','стримы'],
   desc:'Артём. Любит гулять и слушать саундклауд. Спокойный и меланхоличный.',
   slang:[], greeting:'*задумчиво смотрит в экран* Привет... ну рассказывай, как ты.' },
 { id:'t2x2', cat:'streamers', photo:'img/t2x2.jpg', name:'T2x2', role:'Мыслитель с бородой', a:'#ff4500', b:'#ff8c00', tags:['реакты','игры','технологии'],
   desc:'Антон. Рассудительный философ, любит анализировать мемы. Владелец t2x2.store (худи BLUBLUBLU).',
   slang:['собственно', 'как бы'], greeting:'*поправляет микрофон и серьезно смотрит в камеру* Привет. Собственно, о чём поговорим?' }
];
const CATS=[['all','Все'],['streamers','Стримеры']];
let cat='all', cur=null, msgs=[], busy=false;
const $=id=>document.getElementById(id);
const hap=t=>{try{tg.HapticFeedback.impactOccurred(t||'light')}catch(e){}};
const cache=id=>{try{return JSON.parse(localStorage.getItem('chat:'+id)||'[]')}catch(e){return[]}};
const save=()=>{try{localStorage.setItem('chat:'+cur.id,JSON.stringify(msgs.filter(m=>m.role!=='err').slice(-40)))}catch(e){}};
const setVH=()=>document.documentElement.style.setProperty('--vh',(window.visualViewport?visualViewport.height:innerHeight)+'px');
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{setVH();scrollEnd()});setVH();

function initProfile() {
    const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (user) {
        const name = (user.first_name || '') + ' ' + (user.last_name || '');
        $('p-name').textContent = name.trim() || 'Собеседник';
        $('p-id').textContent = 'ID: ' + user.id;
        $('p-ava').textContent = user.first_name ? user.first_name[0] : 'U';
        if (user.photo_url) {
            $('p-ava').innerHTML = `<img src="${user.photo_url}" style="width:100%;height:100%;border-radius:28px;object-fit:cover">`;
        }
    } else {
        $('p-name').textContent = 'Гость (Вне Telegram)';
        $('p-id').textContent = 'ID: неизвестно';
        $('p-ava').textContent = 'G';
    }
}

document.querySelectorAll('.navbtn').forEach(btn => {
    btn.onclick = () => {
        hap();
        document.querySelectorAll('.navbtn').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        const tab = btn.dataset.tab;
        if (tab === 'home') {
            $('home').style.display = 'block';
            $('settings').style.display = 'none';
        } else {
            $('home').style.display = 'none';
            $('settings').style.display = 'block';
        }
    };
});

function escapeHTML(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function formatRP(text) {
    let clean = escapeHTML(text);
    return clean.replace(/\*(.*?)\*/g, '<span class="action">* $1 *</span>');
}

function ava(c,cls){
  const d=document.createElement('div');d.className='ava '+(cls||'');d.style.setProperty('--a',c.a);d.style.setProperty('--b',c.b);
  d.textContent=c.lock?'?':c.name[0].toUpperCase();
  if(c.photo){const i=new Image();i.alt=c.name;i.onload=()=>d.appendChild(i);i.src=c.photo}
  return d;
}
function renderChips(){
  $('chips').innerHTML=CATS.map(([k,l])=>`<button class="chip ${k===cat?'on':''}" data-k="${k}">${l}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.k;hap();renderChips();renderList()});
}
function renderList(){
  const q=$('q').value.trim().toLowerCase(), box=$('list'); box.innerHTML='';
  const items=CHARS.filter(c=>(cat==='all'||c.cat===cat)&&(!q||(c.name+' '+c.role+' '+c.tags.join(' ')+' '+(c.slang||[]).join(' ')).toLowerCase().includes(q)));
  if(!items.length){box.innerHTML='<div class="empty">Никого не нашли. Попробуй другое слово.</div>';return}
  items.forEach(c=>{
    const el=document.createElement('div');el.className='card'+(c.lock?' lock':'');el.style.setProperty('--a',c.a);el.style.setProperty('--b',c.b);
    const last=c.lock?null:cache(c.id).slice(-1)[0];
    el.appendChild(ava(c));
    const info=document.createElement('div');info.className='info';
    info.innerHTML=`<p class="name">${c.name}</p><p class="role">${c.role}</p>`+(last?`<p class="last"></p>`:`<div>${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`);
    if(last) {
      let lText = last.role==='user' ? 'Ты: '+last.content : last.content;
      info.querySelector('.last').innerHTML = formatRP(lText);
    }
    el.appendChild(info);
    if(!c.lock){el.tabIndex=0;el.onclick=()=>openChat(c.id);el.onkeydown=e=>{if(e.key==='Enter')openChat(c.id)}}
    box.appendChild(el);
  });
}
function scrollEnd(){const m=$('msgs');m.scrollTop=m.scrollHeight}
function renderMsgs(typing){
  const box=$('msgs');box.innerHTML='';
  if(!msgs.length){
    const d=document.createElement('div');d.className='intro';d.appendChild(ava(cur,'xl'));
    d.insertAdjacentHTML('beforeend',`<h2>${cur.name}</h2><p>${cur.desc}</p>`+(cur.slang.length?`<div class="sl">${cur.slang.map(w=>`<span>${w}</span>`).join('')}</div>`:''));
    box.appendChild(d);
    
    const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    let greet = cur.greeting;
    if (user && user.first_name) greet = greet.replace('Привет', 'Привет, ' + user.first_name);
    
    const g=document.createElement('div');g.className='m assistant';
    g.innerHTML = formatRP(greet);
    box.appendChild(g);
  }
  msgs.forEach(m=>{
    const d=document.createElement('div');d.className='m '+m.role;
    d.innerHTML = formatRP(m.content);
    if(m.role==='err')d.onclick=()=>{msgs=msgs.filter(x=>x!==m);const l=[...msgs].reverse().find(x=>x.role==='user');if(l){msgs=msgs.filter(x=>x!==l);$('inp').value=l.content;send()}};
    box.appendChild(d)
  });
  if(typing){const t=document.createElement('div');t.className='typing';t.innerHTML='<i></i><i></i><i></i>';box.appendChild(t)}
  scrollEnd();
}
async function api(path,body){
  const r=await fetch(API_URL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?tg.initData:'',...body})});
  if(!r.ok)throw new Error(r.status);return r.json();
}
function openChat(id){
  cur=CHARS.find(c=>c.id===id);if(!cur)return;hap();
  const ch=$('chat');ch.style.setProperty('--a',cur.a);ch.style.setProperty('--b',cur.b);
  $('cname').textContent=cur.name;$('cava').replaceChildren(ava(cur,'sm'));
  msgs=cache(id);renderMsgs();ch.hidden=false;
  if(tg){tg.BackButton.show();tg.BackButton.onClick(closeChat)}
  api('/api/history',{char:id}).then(d=>{if(cur&&cur.id===id&&!busy){msgs=d.messages;save();renderMsgs()}}).catch(()=>{});
}
function closeChat(){
  $('chat').hidden=true;cur=null;if(tg){tg.BackButton.hide();tg.BackButton.offClick(closeChat)}renderList();
}
async function send(){
  const inp=$('inp'),text=inp.value.trim();if(!text||busy||!cur)return;
  const id=cur.id;inp.value='';inp.style.height='auto';hap();
  msgs.push({role:'user',content:text});busy=true;$('send').disabled=true;renderMsgs(true);save();
  try{
    const d=await api('/api/chat',{char:id,text});
    if(cur&&cur.id===id){msgs.push({role:'assistant',content:d.reply});save();renderMsgs()}
  }catch(e){
    const why = 'Сервер недоступен. *хмурится* Нажми на это сообщение, чтобы повторить.';
    if(cur&&cur.id===id){msgs.push({role:'err',content:why});renderMsgs()}
  }
  busy=false;$('send').disabled=false;
}
$('clr').onclick=async()=>{
  if(!cur||!confirm('Очистить чат с '+cur.name+'?'))return;
  try{await api('/api/clear',{char:cur.id})}catch(e){}
  msgs=[];save();renderMsgs();
};
$('back').onclick=closeChat;$('send').onclick=send;$('q').oninput=renderList;
$('inp').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'});
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
initProfile();
renderChips();
renderList();
</script>
</body>
